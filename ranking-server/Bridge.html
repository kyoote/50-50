<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const channel = '<?= channel ?>';
const allowed = origin => origin === 'https://kyoote.github.io' || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(origin);
window.addEventListener('message', event => {
  if (event.source !== top || !allowed(event.origin) || !event.data || event.data.channel !== channel) return;
  const {id, action, data} = event.data;
  const reply = message => event.source.postMessage({channel, id, ...message}, event.origin);
  google.script.run.withSuccessHandler(result => reply({result})).withFailureHandler(error => reply({error: error.message || '通信に失敗しました'})).ranking(action, data);
});
top.postMessage({channel, ready: true}, '*');
</script></body></html>
